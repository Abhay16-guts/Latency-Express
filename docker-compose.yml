version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: latency_express_pg
    environment:
      POSTGRES_USER: latency_user
      POSTGRES_PASSWORD: latency_password
      POSTGRES_DB: latency_express_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U latency_user -d latency_express_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: latency_express_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: latency_express_api
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://latency_user:latency_password@postgres:5432/latency_express_dev
      REDIS_URL: redis://redis:6379
      JWT_SECRET: super_secret_jwt_key_latency_express_2026_prod
      CORS_ORIGIN: "*"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    container_name: latency_express_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

volumes:
  pgdata:
  redisdata:
